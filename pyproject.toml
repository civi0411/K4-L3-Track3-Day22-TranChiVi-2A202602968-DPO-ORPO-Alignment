[project]
name = "day22-dpo-alignment-lab"
version = "0.2.0"
description = "VinUni AICB Day 22 — DPO/ORPO Alignment lab (Track 3)"
requires-python = ">=3.10,<3.15"
readme = "README.md"

# T4 baseline (mirrors requirements.txt). `uv pip install -e .` is faster
# than venv+pip; both work.
dependencies = [
    "unsloth>=2026.10.1",
    "trl>=1.13,<1.14",
    "transformers>=5.2,<5.18",
    "peft>=0.18,<1.0",
    "accelerate>=1.10,<2.0",
    "bitsandbytes>=0.48,<1.0",
    "datasets>=4.7,<5.0",
    "matplotlib>=3.9,<4.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=17",
    "llama-cpp-python>=0.3.16,<1.0",
    "lm-eval[ifeval,math]>=0.4.13,<0.5",
    "jupyterlab>=4.3,<5.0",
    "jupytext>=1.16,<2.0",
    "openai>=1.55,<4.0",
    "anthropic>=0.40,<2.0",
    "pytest>=8.3,<10.0",
]

[project.optional-dependencies]
biggpu = [
    "vllm>=0.10",
    "flash-attn>=2.7,<3.0",
]

[tool.setuptools]
packages = ["lab22"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["colab", "kaggle"]  # generated by scripts/build_colab.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import per cell after the ROOT bootstrap.
"notebooks/*.py" = ["E402", "E501", "I001"]  # `import unsloth` must stay before torch/trl
"scripts/*.py" = ["E402"]
